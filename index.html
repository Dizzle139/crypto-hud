<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<!-- viewport-fit=cover lets the dashboard this page decrypts into itself reach
     under the notch and the home indicator, which is what its env(safe-area-*)
     padding is there to manage. Without it iOS letterboxes the page instead. -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- This page is the only code that ever handles the password, so it is locked
     down to the narrowest policy that still lets the dashboard run once
     decrypted. The load-bearing directives are connect-src and form-action:
     even if a script were somehow injected here, it could not send the
     password anywhere but back to this origin, which already has the
     ciphertext. default-src 'none' means anything not named below is refused.
     The decrypted dashboard is written into THIS document, so it inherits this
     policy -- which is why the font origins are listed. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'unsafe-inline';
  style-src 'unsafe-inline' https://fonts.googleapis.com;
  font-src https://fonts.gstatic.com;
  img-src 'self' data:;
  connect-src 'self';
  form-action 'none';
  base-uri 'none';
">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Crypto HUD</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center;
    justify-content: center; background: #05070a; color: #d7e6f0;
    font-family: system-ui, -apple-system, sans-serif; padding: 24px;
    background-image:
      linear-gradient(rgba(47,178,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(47,178,255,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  form {
    width: 100%; max-width: 360px; background: #0c1219;
    border: 1px solid #1b2732; border-radius: 6px; padding: 26px 24px;
    box-shadow: 0 0 0 1px #1b2732, 0 8px 28px -14px rgba(47,178,255,0.2);
  }
  h1 {
    font-size: 18px; letter-spacing: 0.06em; text-transform: uppercase;
    margin: 0 0 4px; font-weight: 700;
  }
  p { margin: 0 0 18px; font-size: 13px; color: #6d8393; line-height: 1.5; }
  #urow { margin-bottom: 14px; }
  #urow[hidden] { display: none; }
  label {
    display: block; font-size: 11px; letter-spacing: 0.09em;
    text-transform: uppercase; color: #6d8393; margin-bottom: 6px;
  }
  input {
    width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 15px;
    font-family: ui-monospace, monospace; background: #05070a; color: #d7e6f0;
    border: 1px solid #1b2732; border-radius: 4px;
  }
  input:focus { outline: 2px solid #2fb2ff; outline-offset: 1px; }
  button {
    width: 100%; margin-top: 14px; padding: 11px; font-size: 14px;
    font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    background: #2fb2ff; color: #05070a; border: 0; border-radius: 4px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.55; cursor: default; }
  .msg { margin-top: 14px; font-size: 13px; min-height: 18px; color: #ffab5e; }
</style>
</head><body>
<form id="f" autocomplete="on">
  <h1>Crypto HUD</h1>
  <p>This dashboard is encrypted. Enter the password to decrypt it in your browser.</p>
  <div id="urow" hidden>
    <label for="u">Username</label>
    <input id="u" type="text" name="username" autocomplete="username"
           spellcheck="false" autocapitalize="none">
  </div>
  <label for="p">Password</label>
  <input id="p" type="password" name="password" autocomplete="current-password"
         spellcheck="false">
  <button id="b" type="submit">Unlock</button>
  <div class="msg" id="m" role="status" aria-live="polite"></div>
</form>
<script>
(function () {
  // frame-ancestors is header-only and GitHub Pages sends no custom headers,
  // so refuse to run framed rather than let this sit under someone's overlay.
  if (window.top !== window.self) {
    document.documentElement.textContent = 'This page cannot be embedded.';
    return;
  }
  var SALT = "Fs6HrcRozps7TdWrm3Fjyw==", ITER = 310000, WANT_USER = true;
  var f = document.getElementById('f'), inp = document.getElementById('p'),
      btn = document.getElementById('b'), msg = document.getElementById('m'),
      user = document.getElementById('u'), urow = document.getElementById('urow');
  if (WANT_USER) { urow.hidden = false; user.focus(); } else { inp.focus(); }

  function bytes(b64) {
    var bin = atob(b64), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }
  function b64(buf) {
    var a = new Uint8Array(buf), s = '';
    for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);
    return btoa(s);
  }

  if (!window.crypto || !crypto.subtle) {
    msg.textContent = 'This browser cannot decrypt the page (needs HTTPS).';
    btn.disabled = true;
    return;
  }

  function unlock(username, password) {
    // Must match derive() in encrypt_site.py exactly: username, newline,
    // password. A newline cannot appear in either field, so no two different
    // credential pairs can derive the same key.
    var material = WANT_USER ? (username + "\n" + password) : password;
    return crypto.subtle.importKey('raw', new TextEncoder().encode(material),
                                   'PBKDF2', false, ['deriveBits'])
      .then(function (base) {
        return crypto.subtle.deriveBits(
          { name: 'PBKDF2', salt: bytes(SALT), iterations: ITER, hash: 'SHA-256' },
          base, 256);
      })
      .then(function (raw) {
        var keyB64 = b64(raw);
        return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt'])
          .then(function (key) {
            return fetch('page.enc', { cache: 'no-store' })
              .then(function (r) {
                if (!r.ok) throw new Error('page.enc missing');
                return r.json();
              })
              .then(function (box) {
                return crypto.subtle.decrypt(
                  { name: 'AES-GCM', iv: bytes(box.iv) }, key, bytes(box.ct));
              })
              .then(function (buf) {
                // GCM is authenticated: reaching here means the password was
                // right. A wrong one rejects above rather than yielding garbage.
                try { sessionStorage.setItem('hud-k', keyB64); } catch (e) {}
                var html = new TextDecoder().decode(buf);
                document.open();
                document.write(html);
                document.close();
              });
          });
      });
  }

  f.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!inp.value || (WANT_USER && !user.value)) return;
    btn.disabled = true;
    msg.style.color = '#6d8393';
    msg.textContent = 'Decrypting\u2026';
    unlock(WANT_USER ? user.value : '', inp.value).catch(function (err) {
      btn.disabled = false;
      msg.style.color = '#ffab5e';
      // The page cannot tell WHICH credential was wrong -- it only knows the
      // derived key failed to decrypt. Saying so honestly also avoids telling
      // an attacker that a username exists.
      msg.textContent = String(err && err.message).indexOf('missing') > -1
        ? 'Encrypted data not found on the server.'
        : (WANT_USER ? 'Wrong username or password.' : 'Wrong password.');
      inp.select();
    });
  });
})();
</script>
</body></html>
